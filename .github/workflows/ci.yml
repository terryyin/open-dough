name: CI

on:
  push:
    paths-ignore:
      - ".planning/**"
      - "docs/**"
  pull_request:
    paths-ignore:
      - ".planning/**"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        check: [lint, test]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Install shell lint tools
        if: matrix.check == 'lint'
        env:
          SHELLCHECK_VERSION: "0.11.0"
          SHFMT_VERSION: "3.14.0"
        run: |
          tool_dir=$(mktemp -d)
          trap 'rm -rf -- "${tool_dir}"' EXIT
          curl --fail --silent --show-error --location \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            --output "${tool_dir}/shellcheck.tar.xz"
          tar -xJf "${tool_dir}/shellcheck.tar.xz" -C "${tool_dir}"
          sudo install -m 755 "${tool_dir}/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          curl --fail --silent --show-error --location \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64" \
            --output "${tool_dir}/shfmt"
          sudo install -m 755 "${tool_dir}/shfmt" /usr/local/bin/shfmt
          shellcheck --version
          shfmt --version
      # On cancellation the Actions runner signals only the step shell's pid
      # (INT, then TERM 7.5 s later). `exec` makes npm that process; npm
      # forwards the signal to its `sh -c`, which the `exec` in package.json's
      # test script replaces with the runner, so it reports what was running.
      - name: Run ${{ matrix.check }}
        run: exec npm run "${{ matrix.check }}"

  # The dashboard's browser suite is not a shell test, so `npm test` never
  # discovers it. It runs here as its own check, against controlled GitHub
  # responses: no credentials and no live project contents.
  dashboard:
    name: dashboard
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Type-check the dashboard
        run: npm run typecheck:dashboard
      - name: Build the dashboard
        run: npm run build:dashboard
      - name: Run the dashboard browser suite
        run: npm run test:dashboard
      - name: Keep Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-playwright-diagnostics
          path: |
            dashboard/playwright-report/
            dashboard/test-results/
          if-no-files-found: ignore
          retention-days: 7
