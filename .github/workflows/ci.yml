name: CI

on:
  push:
    paths-ignore:
      - ".planning/**"
      - "docs/**"
  pull_request:
    paths-ignore:
      - ".planning/**"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

# The revision a run's CI proof names: a pull request's head, not its merge.
env:
  CI_PROOF_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

# Cancel superseded branch and pull-request runs, while keeping deliberate
# manual repetitions independent for scripts/ci-repeat.sh.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  # Lint and the shard-independent dashboard type-check run once outside the
  # test matrices and the browser deadlines.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Start prerequisite acquisition deadline (180 seconds)
        run: echo "OPEN_DOUGH_SETUP_DEADLINE_MS=$(( $(date +%s) * 1000 + 180000 ))" >> "$GITHUB_ENV"
      # Restoring the existing npm cache and installing Node share one minute.
      - &start-node-setup
        name: Start Node and npm cache deadline (60 seconds)
        run: echo "OPEN_DOUGH_NODE_DEADLINE_MS=$(( $(date +%s) * 1000 + 60000 ))" >> "$GITHUB_ENV"
      - &cache-npm
        name: Restore npm cache
        uses: actions/setup-node@v7
        id: npm-cache
        timeout-minutes: 1
        with:
          cache: npm
      - &setup-node
        name: Install pinned Node
        id: node
        timeout-minutes: 1
        run: bash scripts/setup-ci-node.sh .node-version
      - &diagnose-node
        name: Diagnose Node acquisition failure
        if: failure() && (steps.node.outcome == 'failure' || steps.npm-cache.outcome == 'failure')
        run: |
          echo '::error::Infrastructure setup: Node or npm cache acquisition failed within its 60-second deadline. Restore GitHub Releases, nodejs.org, or cache connectivity and rerun setup before checks.'
          exit 1
      - name: Install npm dependencies
        run: node scripts/setup-native.mjs npm
      - name: Install shell lint tools
        id: lint-tools
        timeout-minutes: 1
        env:
          SHELLCHECK_VERSION: "0.11.0"
          SHFMT_VERSION: "3.14.1"
        run: bash scripts/setup-lint-tools.sh
      - name: Diagnose lint tool acquisition failure
        if: failure() && steps.lint-tools.outcome == 'failure'
        run: |
          echo "::error::Infrastructure setup: shell lint tool acquisition failed or exceeded its setup bound. Restore GitHub Releases/Docker Hub connectivity and rerun setup before checks."
          exit 1
      - name: Run lint
        run: exec npm run lint
      - name: Type-check the dashboard
        run: npm run typecheck:dashboard

  # `npm test` runs one job per matrix share, each running its share of the
  # discovered checks (OPEN_DOUGH_TEST_SPLIT, Distribution/tests/runner-settings.md), failing
  # on its own failing check or time-budget breach. The matrix lists only the
  # shares; everything else takes the count from strategy.job-total.
  distribution-tests:
    name: Distribution Tests (${{ matrix.share }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        share: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      # Shared job-start epochs: slow setup shortens the test share; self-stop keeps reports.
      - name: Start prerequisite acquisition (180 seconds) and test-run (320 seconds) deadlines
        run: |
          started=$(( $(date +%s) * 1000 ))
          echo "OPEN_DOUGH_SETUP_DEADLINE_MS=$(( started + 180000 ))" >> "$GITHUB_ENV"
          echo "OPEN_DOUGH_TEST_DEADLINE_MS=$(( started + 320000 ))" >> "$GITHUB_ENV"
      - *start-node-setup
      - *cache-npm
      - *setup-node
      - *diagnose-node
      - name: Install npm dependencies
        run: node scripts/setup-native.mjs npm
      # Cancellation signals only this step's pid; `exec` makes npm/the runner that process.
      - name: Run Distribution Tests
        id: suite
        env:
          OPEN_DOUGH_TEST_SPLIT: ${{ matrix.share }}/${{ strategy.job-total }}
          OPEN_DOUGH_TEST_TIMES: ${{ runner.temp }}/test-times.txt
          OPEN_DOUGH_TEST_OUTCOMES: ${{ runner.temp }}/test-outcomes.txt
        run: exec npm run test
      # Per-job seconds for this share: time-budget calibration and longest-first.
      - name: Keep per-job test times
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-times-${{ matrix.share }}
          path: ${{ runner.temp }}/test-times.txt
          if-no-files-found: ignore
          retention-days: 7
      # This share's Distribution Tests: one outcome per check file.
      - name: Keep the CI proof fragments
        if: ${{ !cancelled() && steps.suite.outcome != 'skipped' }}
        uses: ./.github/actions/ci-proof-fragments
        with:
          producer: distribution-tests
          part: ${{ matrix.share }}
          parts: ${{ strategy.job-total }}
          entries: Distribution
          report-format: outcomes
          unit: file
          report: ${{ runner.temp }}/test-outcomes.txt
          times: ${{ runner.temp }}/test-times.txt

  # The browser test groups, which `npm test` never discovers: each is its own
  # producer (./browser-test-group.yml) with its own command, settings,
  # shards, duration list, outputs and CI proof entry (Distribution/tests/README.md).
  e2e:
    uses: ./.github/workflows/browser-test-group.yml
    with:
      group: e2e
      command: test:e2e
      settings: OPEN_DOUGH_E2E
      root: e2e
      shards: "[1, 2, 3, 4, 5, 6]"
  dashboard-integrated:
    uses: ./.github/workflows/browser-test-group.yml
    with:
      group: dashboard-integrated
      command: test:dashboard:integrated
      settings: OPEN_DOUGH_DASHBOARD_INTEGRATED
      root: dashboard/tests
      shards: "[1, 2, 3, 4, 5]"
  dashboard-frontend:
    uses: ./.github/workflows/browser-test-group.yml
    with:
      group: dashboard-frontend
      command: test:dashboard:frontend
      settings: OPEN_DOUGH_DASHBOARD_FRONTEND
      root: dashboard/frontend-tests
      shards: "[1]"
  dashboard-backend:
    uses: ./.github/workflows/browser-test-group.yml
    with:
      group: dashboard-backend
      command: test:dashboard:backend
      settings: OPEN_DOUGH_DASHBOARD_BACKEND
      root: dashboard/backend-tests
      shards: "[1, 2, 3, 4]"

  # One CI proof summary per run attempt once the proof jobs settle, however they
  # ended, against declared Intent locations, parts and units their reports give.
  ci-proof:
    needs:
      - distribution-tests
      - e2e
      - dashboard-integrated
      - dashboard-frontend
      - dashboard-backend
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - *setup-node
      - *diagnose-node
      - name: Summarize CI proof
        uses: ./.github/actions/ci-proof-summary
        with:
          expect: e2e=6:case dashboard/tests=5:case dashboard/frontend-tests=1:case dashboard/backend-tests=4:case Distribution=4:file
          frontend-entry: dashboard/frontend-tests
