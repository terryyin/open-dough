name: CI

on:
  push:
    paths-ignore:
      - ".planning/**"
      - "docs/**"
  pull_request:
    paths-ignore:
      - ".planning/**"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # lint runs once, as its own job so it does not count toward the test
  # matrix's job-total.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Start prerequisite acquisition deadline (180 seconds)
        run: echo "OPEN_DOUGH_SETUP_DEADLINE_MS=$(( $(date +%s) * 1000 + 180000 ))" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        id: node
        timeout-minutes: 1
        with:
          node-version-file: .node-version
          cache: npm
      - name: Diagnose Node acquisition failure
        if: failure() && steps.node.outcome == 'failure'
        run: |
          echo '::error::Infrastructure setup: Node/npm-cache acquisition failed or exceeded 60 seconds. Restore nodejs.org/cache connectivity and rerun setup before checks.'
          exit 1
      - name: Install npm dependencies
        run: node scripts/setup-native.mjs npm
      - name: Install shell lint tools
        id: lint-tools
        timeout-minutes: 1
        env:
          SHELLCHECK_VERSION: "0.11.0"
          SHFMT_VERSION: "3.14.0"
        run: |
          remaining=$(( (OPEN_DOUGH_SETUP_DEADLINE_MS - $(date +%s) * 1000) / 1000 ))
          if ((remaining <= 0)); then
            echo "::error::Infrastructure setup: lint tool acquisition deadline expired. Restore GitHub release connectivity and rerun setup before checks."
            exit 1
          fi
          timeout --signal=KILL "${remaining}s" bash -euo pipefail <<'TOOLS'
          tool_dir=$(mktemp -d)
          trap 'rm -rf -- "${tool_dir}"' EXIT
          curl --fail --silent --show-error --location --connect-timeout 5 --max-time 20 --retry 0 \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            --output "${tool_dir}/shellcheck.tar.xz"
          tar -xJf "${tool_dir}/shellcheck.tar.xz" -C "${tool_dir}"
          sudo install -m 755 "${tool_dir}/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          curl --fail --silent --show-error --location --connect-timeout 5 --max-time 20 --retry 0 \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64" \
            --output "${tool_dir}/shfmt"
          sudo install -m 755 "${tool_dir}/shfmt" /usr/local/bin/shfmt
          shellcheck --version
          shfmt --version
          TOOLS
      - name: Diagnose lint tool acquisition failure
        if: failure() && steps.lint-tools.outcome == 'failure'
        run: |
          echo "::error::Infrastructure setup: GitHub lint tool release acquisition failed or exceeded its setup bound. Restore source connectivity and rerun setup before checks."
          exit 1
      - name: Run lint
        run: exec npm run lint

  # `npm test` runs as one split job per share in the matrix, each running one
  # share of the discovered checks (OPEN_DOUGH_TEST_SPLIT, see
  # tests/README.md) and failing on its own failing check or its own
  # time-budget breach. The matrix lists only the shares; the job-name suffix,
  # the split value, and the times artifact derive the count from the matrix
  # (strategy.job-total).
  test:
    name: test (${{ matrix.share }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        share: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Start prerequisite acquisition deadline (180 seconds)
        run: echo "OPEN_DOUGH_SETUP_DEADLINE_MS=$(( $(date +%s) * 1000 + 180000 ))" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        id: node
        timeout-minutes: 1
        with:
          node-version-file: .node-version
          cache: npm
      - name: Diagnose Node acquisition failure
        if: failure() && steps.node.outcome == 'failure'
        run: |
          echo '::error::Infrastructure setup: Node/npm-cache acquisition failed or exceeded 60 seconds. Restore nodejs.org/cache connectivity and rerun setup before checks.'
          exit 1
      - name: Install npm dependencies
        run: node scripts/setup-native.mjs npm
      # On cancellation the Actions runner signals only the step shell's pid
      # (INT, then TERM 7.5 s later). `exec` makes npm that process; npm
      # forwards the signal to its `sh -c`, which the `exec` in package.json's
      # test script replaces with the runner, so it reports what was running.
      - name: Run test
        env:
          OPEN_DOUGH_TEST_SPLIT: ${{ matrix.share }}/${{ strategy.job-total }}
          OPEN_DOUGH_TEST_TIMES: ${{ runner.temp }}/test-times.txt
        run: exec npm run test
      # The test runner's per-job seconds for this job's share on this runner,
      # for calibrating the time budget and longest-first.
      - name: Keep per-job test times
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-times-${{ matrix.share }}
          path: ${{ runner.temp }}/test-times.txt
          if-no-files-found: ignore
          retention-days: 7

  # The dashboard's browser suite is not a shell test, so `npm test` never
  # discovers it. It runs here as its own check, against controlled GitHub
  # responses: no credentials and no live project contents. One Playwright
  # shard job per shard in the matrix each runs one share of the browser
  # spec files (longest-first, dealt round-robin; the count derives from
  # the matrix) and fails on its own failing test. The
  # type-check does not depend on the shard, so it runs once, in the last
  # share, whose recorded browser load is smallest.
  # The suite's globalSetup runs `npm run build:dashboard` itself and fails
  # the shard when the build fails, so no separate build step is needed.
  dashboard:
    name: dashboard (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8, 9]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Both deadlines count from the job's start, so a slow setup shortens
      # the browser suite's time rather than pushing it past the job bound.
      - name: Start prerequisite acquisition (180 seconds) and browser suite (320 seconds) deadlines
        run: |
          started=$(( $(date +%s) * 1000 ))
          echo "OPEN_DOUGH_SETUP_DEADLINE_MS=$(( started + 180000 ))" >> "$GITHUB_ENV"
          echo "OPEN_DOUGH_DASHBOARD_DEADLINE_MS=$(( started + 75000 ))" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        id: node
        timeout-minutes: 1
        with:
          node-version-file: .node-version
          cache: npm
      - name: Diagnose Node acquisition failure
        if: failure() && steps.node.outcome == 'failure'
        run: |
          echo '::error::Infrastructure setup: Node/npm-cache acquisition failed or exceeded 60 seconds. Restore nodejs.org/cache connectivity and rerun setup before checks.'
          exit 1
      - name: Install npm dependencies
        run: node scripts/setup-native.mjs npm
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        id: playwright-cache
        timeout-minutes: 1
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1"
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Diagnose browser cache failure
        if: failure() && steps.playwright-cache.outcome == 'failure'
        run: |
          echo '::error::Infrastructure setup: Chromium cache acquisition failed or exceeded 60 seconds. Restore cache connectivity and rerun setup before checks.'
          exit 1
      - name: Install Playwright Chromium
        run: node scripts/setup-native.mjs browser
      - name: Type-check the dashboard
        if: matrix.shard == strategy.job-total
        run: npm run typecheck:dashboard
      # The suite ends itself at OPEN_DOUGH_DASHBOARD_DEADLINE_MS, at least
      # 35 seconds inside the job's 6 minutes, naming the deadline. A shard
      # that runs out of time then fails instead of being cancelled, so the
      # report below is still kept.
      - name: Run the dashboard browser suite
        env:
          OPEN_DOUGH_DASHBOARD_SPLIT: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: npm run test:dashboard
      # The HTML report records how many browser tests each shard executed,
      # and on failure, including the suite's own deadline, it and
      # test-results/ keep the completed tests' diagnostics and name the
      # unfinished ones, so each shard keeps its own whenever the suite was
      # not cancelled.
      - name: Keep the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-playwright-report-${{ matrix.shard }}
          path: |
            dashboard/playwright-report/
            dashboard/test-results/
          if-no-files-found: ignore
          retention-days: 7
