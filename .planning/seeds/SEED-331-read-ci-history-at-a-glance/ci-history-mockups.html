<div id="od-ci-reading" aria-label="Open Dough Intent mockups">
  <header class="od-app">
    <span class="od-brand"><span aria-hidden="true"></span>Open Dough</span>
    <span class="od-app-divider" aria-hidden="true"></span>
    <span class="od-app-view"><i data-lucide="layers" aria-hidden="true"></i>Intent</span>
  </header>
  <div class="od-story">
    <div class="od-story-meta"><span class="od-done"><i data-lucide="circle-check" aria-hidden="true"></i>Done</span><code>SEED-288</code></div>
    <h2>Keep Done CI comparisons refreshable</h2>
    <nav class="od-tabs" aria-label="Selected story views">
      <button type="button" class="cursor-interaction" data-page="wall" aria-current="page">CI comparison</button>
      <button type="button" class="cursor-interaction" data-page="entry">Changed tests</button>
    </nav>
  </div>
  <div id="od-ci-mock-reading"></div>
</div>

<style>
  #od-ci-reading {
    color-scheme: light dark;
    --od-surface: light-dark(#f6f6f3, #111722);
    --od-paper: light-dark(#fff, #192130);
    --od-text: light-dark(#1d1d1b, #edf1fa);
    --od-quiet: light-dark(#55554f, #b0bdd2);
    --od-line: light-dark(#deded7, #374358);
    --od-accent: light-dark(#1b5fa8, #c4d2ff);
    --od-accent-bg: light-dark(#e6eef8, #29395d);
    --od-green: light-dark(#1b6e3c, #a4dfc1);
    --od-green-bg: light-dark(#e9f4eb, #203a32);
    --od-amber: light-dark(#7b5118, #f0c588);
    --od-amber-bg: light-dark(#f8efde, #392f22);
    --od-red: light-dark(#9b1c1c, #f0a8a8);
    --od-red-bg: light-dark(#fbeeee, #3a2228);
    --od-hover: light-dark(#ecece7, #232e41);
    --od-plot-height: 176px;
    background: var(--od-surface);
    border: 1px solid var(--od-line);
    border-radius: 12px;
    color: var(--od-text);
    font: 14px/1.4 system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    overflow: clip;
  }
  #od-ci-reading *, #od-ci-reading *::before, #od-ci-reading *::after { box-sizing: border-box; }
  #od-ci-reading h2, #od-ci-reading h3, #od-ci-reading h4, #od-ci-reading p, #od-ci-reading dl, #od-ci-reading dd, #od-ci-reading figure { margin: 0; }
  #od-ci-reading h2 { font: 660 clamp(18px, 3vw, 25px)/1.2 system-ui, sans-serif; letter-spacing: -.028em; }
  #od-ci-reading h3 { font: 640 17px/1.25 system-ui, sans-serif; letter-spacing: -.015em; }
  #od-ci-reading h4 { font: 630 14px/1.35 system-ui, sans-serif; }
  #od-ci-reading code { background: transparent; color: inherit; padding: 0; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
  #od-ci-reading button, #od-ci-reading select { color: inherit; font: inherit; }
  #od-ci-reading button { appearance: none; background: transparent; border: 0; padding: 0; text-align: start; }
  #od-ci-reading :is(button,select):focus-visible { outline: 2px solid var(--od-accent); outline-offset: 2px; }
  #od-ci-reading [data-lucide], #od-ci-reading .lucide { display: inline-block; width: 15px; height: 15px; flex: none; vertical-align: -.16em; }
  #od-ci-reading .od-app { min-height: 47px; padding: 8px 22px; background: var(--od-paper); border-bottom: 1px solid var(--od-line); display: flex; align-items: center; gap: 13px; }
  #od-ci-reading .od-brand, #od-ci-reading .od-app-view, #od-ci-reading .od-done { display: inline-flex; align-items: center; gap: 7px; }
  #od-ci-reading .od-brand { font-weight: 680; letter-spacing: -.015em; }
  #od-ci-reading .od-brand > span { width: 15px; height: 15px; border: 3px solid var(--od-accent); border-radius: 50%; }
  #od-ci-reading .od-app-divider { width: 1px; height: 17px; background: var(--od-line); }
  #od-ci-reading .od-app-view { color: var(--od-quiet); font-size: 13px; }
  #od-ci-reading .od-story { padding: 16px 22px 0; }
  #od-ci-reading .od-story-meta { display: flex; align-items: center; gap: 9px; color: var(--od-quiet); margin-bottom: 6px; }
  #od-ci-reading .od-done { color: var(--od-green); font-size: 12px; gap: 4px; }
  #od-ci-reading .od-done .lucide { width: 13px; height: 13px; }
  #od-ci-reading .od-tabs { display: flex; align-items: stretch; flex-wrap: wrap; gap: 18px; border-bottom: 1px solid var(--od-line); margin-top: 10px; }
  #od-ci-reading .od-tabs button { border-bottom: 2px solid transparent; padding: 8px 1px 7px; color: var(--od-quiet); }
  #od-ci-reading .od-tabs button:hover, #od-ci-reading .od-tabs button[aria-current="page"] { color: var(--od-accent); }
  #od-ci-reading .od-tabs button[aria-current="page"] { border-bottom-color: var(--od-accent); font-weight: 630; }
  #od-ci-reading .od-content { padding: 16px 22px 22px; min-width: 0; }
  #od-ci-reading .od-layout { display: grid; grid-template-columns: minmax(154px, .29fr) minmax(0, 1fr); align-items: start; gap: 17px; }
  #od-ci-reading .od-layout > *, #od-ci-reading .od-main { min-width: 0; }
  #od-ci-reading .od-tree { border: 1px solid var(--od-line); background: var(--od-paper); border-radius: 8px; padding: 7px; display: grid; gap: 2px; }
  #od-ci-reading .od-tree button { display: flex; align-items: center; gap: 6px; border-radius: 5px; padding: 7px; font-size: 12px; overflow-wrap: anywhere; }
  #od-ci-reading .od-tree button[data-page="folder"] { padding-inline-start: 15px; }
  #od-ci-reading .od-tree button[data-page="file"] { padding-inline-start: 23px; }
  #od-ci-reading .od-tree button:hover { background: var(--od-hover); }
  #od-ci-reading .od-tree button[aria-current] { color: var(--od-accent); background: var(--od-accent-bg); font-weight: 620; }
  #od-ci-reading .od-scope { margin-bottom: 11px; }
  #od-ci-reading .od-scope small { display: block; color: var(--od-quiet); font-size: 12px; margin-bottom: 4px; overflow-wrap: anywhere; }
  #od-ci-reading .od-scope h3 { overflow-wrap: anywhere; }
  #od-ci-reading .od-scope .od-tabs { margin-top: 5px; }
  #od-ci-reading .od-comparison { display: grid; gap: 7px; margin-bottom: 12px; }
  #od-ci-reading .od-endpoints { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--od-paper); border: 1px solid var(--od-line); border-radius: 8px; }
  #od-ci-reading .od-endpoints div { padding: 8px 12px; }
  #od-ci-reading .od-endpoints div + div { border-inline-start: 1px solid var(--od-line); }
  #od-ci-reading .od-endpoints dt { display: flex; align-items: center; gap: 5px; color: var(--od-quiet); font-size: 12px; }
  #od-ci-reading .od-endpoints dt .lucide { width: 13px; height: 13px; }
  #od-ci-reading .od-endpoints dd { margin-top: 2px; font-weight: 650; }
  #od-ci-reading .od-history { background: var(--od-paper); border: 1px solid var(--od-line); border-radius: 10px; padding: 13px 14px 11px; }
  #od-ci-reading .od-history-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px 12px; }
  #od-ci-reading .od-history-head h3 { display: flex; align-items: center; gap: 7px; }
  #od-ci-reading .od-history-head h3 .lucide { color: var(--od-accent); }
  #od-ci-reading .od-refresh { display: inline-grid; place-items: center; width: 27px; height: 27px; border-radius: 5px; color: var(--od-quiet); }
  #od-ci-reading .od-refresh:hover { background: var(--od-hover); color: var(--od-accent); }
  #od-ci-reading .od-unit-toggle { display: inline-flex; flex-wrap: wrap; gap: 2px; border-radius: 6px; padding: 2px; background: var(--od-surface); }
  #od-ci-reading .od-unit-toggle button { border-radius: 4px; color: var(--od-quiet); padding: 4px 7px; font-size: 12px; }
  #od-ci-reading .od-unit-toggle button:hover, #od-ci-reading .od-unit-toggle button[aria-pressed="true"] { color: var(--od-accent); background: var(--od-accent-bg); }
  #od-ci-reading .od-metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 11px; }
  #od-ci-reading .od-metrics dt, #od-ci-reading .od-metrics small { color: var(--od-quiet); font-size: 12px; }
  #od-ci-reading .od-metrics dd { display: flex; flex-wrap: wrap; align-items: baseline; gap: 3px 6px; font-size: clamp(15px, 2.6vw, 21px); font-weight: 680; letter-spacing: -.024em; }
  #od-ci-reading .od-metrics dd span { white-space: nowrap; }
  #od-ci-reading .od-delta { --od-delta-ink: var(--od-green); --od-delta-bg: var(--od-green-bg); color: var(--od-delta-ink); }
  #od-ci-reading .od-delta[data-direction="slower"] { --od-delta-ink: var(--od-amber); --od-delta-bg: var(--od-amber-bg); }
  #od-ci-reading .od-delta small { padding: 1px 5px; border-radius: 4px; background: var(--od-delta-bg); color: var(--od-delta-ink); font-weight: 650; letter-spacing: 0; }
  #od-ci-reading .od-figure { margin-top: 6px; }
  #od-ci-reading .od-plot { position: relative; height: var(--od-plot-height); }
  #od-ci-reading .od-plot svg { width: 100%; height: 100%; display: block; overflow: visible; }
  #od-ci-reading .od-plot svg text { fill: var(--od-quiet); font: 11px/1 system-ui, sans-serif; }
  #od-ci-reading .od-grid { stroke: var(--od-line); stroke-width: 1; }
  #od-ci-reading .od-reference-line { stroke: var(--od-quiet); stroke-width: 1.25; stroke-dasharray: 5 5; }
  #od-ci-reading .od-trend { stroke: var(--od-accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
  #od-ci-reading .od-point { fill: var(--od-accent); stroke: var(--od-paper); stroke-width: 1.6; }
  #od-ci-reading .od-selected-point { fill: var(--od-paper); stroke: var(--od-accent); stroke-width: 2.4; }
  #od-ci-reading .od-gap-point { fill: var(--od-paper); stroke: var(--od-quiet); stroke-width: 1.7; }
  #od-ci-reading .od-fail-wash { fill: var(--od-red-bg); }
  #od-ci-reading .od-fail-cross { stroke: var(--od-red); stroke-width: 2; stroke-linecap: round; fill: none; }
  #od-ci-reading .od-hit { position: absolute; width: 24px; height: 24px; transform: translate(-50%, -50%); border-radius: 50%; }
  #od-ci-reading .od-hit:hover, #od-ci-reading .od-hit[aria-pressed="true"] { box-shadow: 0 0 0 1px var(--od-accent); }
  #od-ci-reading .od-hit[data-kind="failed"]:hover, #od-ci-reading .od-hit[data-kind="failed"][aria-pressed="true"] { box-shadow: 0 0 0 1px var(--od-red); }
  #od-ci-reading .od-caption { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 7px 12px; }
  #od-ci-reading .od-legend, #od-ci-reading .od-readout { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 11px; color: var(--od-quiet); font-size: 12px; }
  #od-ci-reading .od-legend span, #od-ci-reading .od-readout > span { display: inline-flex; align-items: center; gap: 5px; }
  #od-ci-reading .od-key { width: 8px; height: 8px; display: inline-block; }
  #od-ci-reading .od-key-average { width: 15px; height: 0; border-top: 1.5px dashed var(--od-quiet); }
  #od-ci-reading .od-key-selected { transform: rotate(45deg); border: 1.5px solid var(--od-accent); border-radius: 1px; }
  #od-ci-reading .od-key-gap { border: 1.5px solid var(--od-quiet); border-radius: 50%; }
  #od-ci-reading .od-legend .lucide { width: 12px; height: 12px; }
  #od-ci-reading .od-failed { color: var(--od-red); }
  #od-ci-reading .od-readout { background: var(--od-surface); border-radius: 5px; padding: 4px 7px; min-height: 25px; }
  #od-ci-reading .od-inspect { display: none; color: var(--od-quiet); font-size: 12px; }
  #od-ci-reading .od-inspect select { background: var(--od-paper); border: 1px solid var(--od-line); border-radius: 5px; padding: 4px 7px; }
  #od-ci-reading .od-detail-table { margin-top: 14px; }
  #od-ci-reading table { border-collapse: collapse; border-spacing: 0; width: 100%; margin-top: 4px; text-align: start; }
  #od-ci-reading th, #od-ci-reading td { text-align: end; padding: 6px 7px; border-bottom: 1px solid var(--od-line); font-size: 12px; }
  #od-ci-reading th:first-child, #od-ci-reading td:first-child { text-align: start; padding-inline-start: 0; width: 44%; overflow-wrap: anywhere; }
  #od-ci-reading th:last-child, #od-ci-reading td:last-child { padding-inline-end: 0; }
  #od-ci-reading th { color: var(--od-quiet); font-weight: 550; }
  #od-ci-reading td button, #od-ci-reading .od-return { color: var(--od-accent); }
  #od-ci-reading td button:hover, #od-ci-reading .od-return:hover { text-decoration: underline; }
  #od-ci-reading .od-return { margin-top: 12px; padding: 4px 0; font-size: 12px; }
  #od-ci-reading .od-purpose { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--od-paper); padding: 12px; border: 1px solid var(--od-line); border-radius: 8px; }
  @media (max-width: 590px) {
    #od-ci-reading .od-layout { grid-template-columns: minmax(0, 1fr); gap: 10px; }
    #od-ci-reading .od-tree { display: flex; flex-wrap: wrap; }
    #od-ci-reading .od-tree button[data-page] { padding: 5px 6px; }
  }
  @media (max-width: 460px) {
    #od-ci-reading .od-app, #od-ci-reading .od-story, #od-ci-reading .od-content { padding-inline: 11px; }
    #od-ci-reading .od-history { padding-inline: 9px; }
    #od-ci-reading .od-hit { display: none; }
    #od-ci-reading .od-inspect { display: inline-flex; align-items: center; gap: 6px; }
    #od-ci-reading .od-readout > .od-readout-date { display: none; }
    #od-ci-reading th, #od-ci-reading td { padding-inline: 3px; }
  }
  @media (pointer: coarse) {
    #od-ci-reading button, #od-ci-reading select { min-height: 44px; }
    #od-ci-reading .od-refresh { width: 44px; }
    #od-ci-reading .od-hit { display: none; }
    #od-ci-reading .od-inspect { display: inline-flex; align-items: center; gap: 6px; }
    #od-ci-reading .od-readout > .od-readout-date { display: none; }
  }
</style>

<script>
  (() => {
    const root = document.getElementById("od-ci-reading");
    const reading = document.getElementById("od-ci-mock-reading");
    const dates = ["Nov 4", "Nov 5", "Nov 6", "Nov 7", "Nov 8", "Nov 9", "Nov 10", "Nov 11", "Nov 12"];
    const selected = dates.length - 1;
    const failed = 3;
    const data = {
      wall: { values: [492, 504, 510, null, 501, null, 507, 510, 484], ticks: [480, 495, 510, 525] },
      entry: { values: [230, 238, 234, null, 232, null, 237, 233, 219], ticks: [210, 220, 230, 240] },
      folder: { values: [100, 104, 105, null, 103, null, 106, 106, 108], ticks: [95, 100, 105, 110] },
      file: { values: [18.2, 18.5, 19.1, null, 18.9, null, 19.3, 18.8, 17.6], ticks: [17, 18, 19, 20] },
      fileUnit: { values: [21.3, 22.4, 22.1, null, 21.6, null, 22.9, 21.7, 20.8], ticks: [20, 21, 22, 23] },
    };
    const state = { page: "wall", scope: "entry", unit: "file", purpose: false, point: selected };
    const design = { plotHeight: 176 };
    const pages = {
      entry: { name: "dashboard/tests", icon: "book-open", context: "Entry Summary", compared: [231, 225, 219] },
      folder: { name: "intent", icon: "folder-open", context: "Folder Summary · dashboard/tests", compared: [112, 106, 108] },
      file: { name: "ci-wall-time-history.spec.ts", icon: "file-code-2", context: "dashboard/tests/intent" },
    };
    let plotObserver;

    function icon(name) {
      return `<i data-lucide="${name}" aria-hidden="true"></i>`;
    }

    function time(seconds) {
      const rounded = Math.round(seconds * 10) / 10;
      const minutes = Math.floor(rounded / 60);
      const rest = rounded % 60;
      const digits = Number.isInteger(rounded) ? 0 : 1;
      const remainder = rest.toFixed(digits);
      if (minutes === 0) return `${remainder}s`;
      if (rest === 0) return `${minutes}m`;
      return `${minutes}m ${remainder.padStart(digits === 0 ? 2 : 4, "0")}s`;
    }

    function series() {
      return data[state.page === "file" ? state.unit : state.page];
    }

    function priorOf(values) {
      const previous = values.slice(0, selected).filter((value) => value !== null);
      return { count: previous.length, average: previous.reduce((sum, value) => sum + value, 0) / previous.length };
    }

    function describe(index, value) {
      if (value !== null) return `${index === selected ? "Selected landing · " : ""}${time(value)}`;
      return index === failed ? "Failed build" : "Timing unavailable";
    }

    function history() {
      const { values } = series();
      const { average, count } = priorOf(values);
      const value = values[selected];
      const delta = value - average;
      const percent = Math.round(Math.abs(delta / average) * 100);
      const sign = delta > 0 ? "+" : "−";
      const title = state.page === "wall" ? "CI wall time history" : "Test execution time history";
      const units = state.page !== "file" ? "" : `<div class="od-unit-toggle" role="group" aria-label="Timing unit">
        <button type="button" data-unit="file" aria-pressed="${state.unit === "file"}">Test cases</button>
        <button type="button" data-unit="fileUnit" aria-pressed="${state.unit === "fileUnit"}">Test file</button>
      </div>`;
      const refresh = state.page === "wall" ? `<button type="button" class="od-refresh cursor-interaction" data-refresh aria-label="Refresh history" data-tooltip="Refresh history">${icon("refresh-cw")}</button>` : "";
      const options = dates.map((date, index) => `<option value="${index}">${date}</option>`).join("");
      return `<section class="od-history" aria-labelledby="od-ci-history-title">
        <div class="od-history-head"><h3 id="od-ci-history-title">${icon("chart-no-axes-combined")}${title}</h3>${units}${refresh}</div>
        <dl class="od-metrics">
          <div><dt>Selected landing</dt><dd><span>${time(value)}</span></dd></div>
          <div><dt>Prior-build average</dt><dd><span>${time(average)}</span></dd><small>${count} prior builds</small></div>
          <div><dt>vs. prior average</dt><dd class="od-delta" data-direction="${delta > 0 ? "slower" : "faster"}"><span>${sign}${time(Math.abs(delta))}</span><small>${sign}${percent}%</small></dd></div>
        </dl>
        <figure class="od-figure" aria-label="${title} by build date">
          <div class="od-plot"></div>
          <figcaption class="od-caption">
            <div class="od-legend" aria-label="Chart key">
              <span><i class="od-key od-key-average" aria-hidden="true"></i>Prior average</span>
              <span><i class="od-key od-key-selected" aria-hidden="true"></i>Selected</span>
              <span class="od-failed">${icon("x")}Failed</span>
              <span><i class="od-key od-key-gap" aria-hidden="true"></i>No timing</span>
            </div>
            <label class="od-inspect">Build <select data-inspect>${options}</select></label>
            <p class="od-readout" aria-live="polite" aria-atomic="true"></p>
          </figcaption>
        </figure>
      </section>`;
    }

    function updatePoint(index, status) {
      const { values } = series();
      state.point = index;
      reading.querySelectorAll("[data-point]").forEach((button) => {
        button.setAttribute("aria-pressed", String(Number(button.dataset.point) === index));
      });
      reading.querySelector("[data-inspect]").value = String(index);
      reading.querySelector(".od-readout").innerHTML = status === undefined
        ? `<span class="od-readout-date">${dates[index]}</span><span class="${index === failed ? "od-failed" : ""}">${describe(index, values[index])}</span>`
        : `<span>${status}</span>`;
    }

    function drawPlot(plot, width, height) {
      const { values, ticks } = series();
      const { average } = priorOf(values);
      const left = 52;
      const right = width - 22;
      const top = 13;
      const bottom = height - 51;
      const rail = height - 33;
      const x = (index) => left + (right - left) * index / selected;
      const y = (value) => bottom - (bottom - top) * (value - ticks[0]) / (ticks.at(-1) - ticks[0]);
      const grid = ticks.map((value) => `<line class="od-grid" x1="${left}" x2="${right}" y1="${y(value)}" y2="${y(value)}"/><text x="${left - 7}" y="${y(value) + 4}" text-anchor="end">${time(value)}</text>`).join("");
      const line = values.map((value, index) => value === null ? "" : `${index === 0 || values[index - 1] === null ? "M" : "L"}${x(index)} ${y(value)}`).join(" ");
      const marks = values.map((value, index) => {
        const at = x(index);
        if (index === failed) return `<circle class="od-fail-wash" cx="${at}" cy="${rail}" r="9"/><path class="od-fail-cross" d="M${at - 3.3} ${rail - 3.3}l6.6 6.6m0 -6.6l-6.6 6.6"/>`;
        if (value === null) return `<circle class="od-gap-point" cx="${at}" cy="${rail}" r="4"/>`;
        if (index === selected) return `<path class="od-selected-point" d="M${at} ${y(value) - 6}l6 6-6 6-6-6Z"/>`;
        return `<circle class="od-point" cx="${at}" cy="${y(value)}" r="4.5"/>`;
      }).join("");
      const dateLabels = (width < 360 ? [0, selected] : [0, 4, selected]).map((index) => `<text x="${x(index)}" y="${height - 9}" text-anchor="${index === selected ? "end" : index === 0 ? "start" : "middle"}">${dates[index]}</text>`).join("");
      const hits = values.map((value, index) => `<button type="button" class="od-hit cursor-interaction" data-point="${index}" data-kind="${index === failed ? "failed" : "build"}" aria-label="${dates[index]}, ${describe(index, value)}" aria-pressed="${state.point === index}" style="left:${x(index)}px;top:${value === null ? rail : y(value)}px"></button>`).join("");
      plot.innerHTML = `<svg aria-hidden="true" width="${width}" height="${height}">${grid}<line class="od-reference-line" x1="${left}" x2="${right}" y1="${y(average)}" y2="${y(average)}"/><path class="od-trend" d="${line}"/>${marks}${dateLabels}</svg>${hits}`;
    }

    function endpointSummary() {
      return `<section class="od-comparison" aria-label="Compared builds">
        <h3>CI timing comparison</h3>
        <dl class="od-endpoints">
          <div><dt>${icon("git-commit-horizontal")}Baseline</dt><dd>8m 29s</dd></div>
          <div><dt>${icon("git-branch")}Branch</dt><dd>8m 11s</dd></div>
          <div><dt>${icon("git-merge")}Landed</dt><dd>8m 04s</dd></div>
        </dl>
      </section>`;
    }

    function comparisonTable(title, first, rows) {
      const body = rows.map(([name, route, ...values]) => `<tr>
        <td>${route ? `<button type="button" class="cursor-interaction" data-page="${route}">${name} ${icon("chevron-right")}</button>` : name}</td>
        ${values.map((value) => `<td>${time(value)}</td>`).join("")}</tr>`).join("");
      return `<section class="od-detail-table"><h4>${title}</h4><table aria-label="${title}"><thead><tr><th scope="col">${first}</th><th scope="col">Baseline</th><th scope="col">Branch</th><th scope="col">Landed</th></tr></thead><tbody>${body}</tbody></table></section>`;
    }

    function scopeContents() {
      const { page, purpose } = state;
      const tree = Object.entries(pages).map(([key, { name, icon: symbol }]) => {
        const treeName = key === "file" ? "ci-wall-time-history" : name;
        return `<button type="button" class="cursor-interaction" data-page="${key}" ${key === page ? 'aria-current="page"' : ""}>${icon(symbol)}<span>${treeName}</span></button>`;
      }).join("");
      const { name, context } = pages[page];
      const tabs = page !== "file" ? "" : `<nav class="od-tabs" aria-label="Test file views">
        <button type="button" class="cursor-interaction" data-file-tab="purpose" ${purpose ? 'aria-current="page"' : ""}>Purpose</button>
        <button type="button" class="cursor-interaction" data-file-tab="proof" ${purpose ? "" : 'aria-current="page"'}>Proof</button>
      </nav>`;
      const tables = {
        entry: () => comparisonTable("Folders and files", "Scope", [["intent", "folder", ...pages.folder.compared], ["launches", null, 56, 56, 54], ["Other scopes", null, 63, 63, 57]]),
        folder: () => comparisonTable("Files", "Scope", [[pages.file.name, "file", 18.9, 18.1, 17.6], ["ci-status.spec.ts", null, 31.5, 30.8, 30.1]]),
        file: () => comparisonTable("Compared test execution time", "Unit", [["Test cases", null, 18.9, 18.1, 17.6], ["Test file", null, 22.2, 21.3, 20.8]]),
      };
      return `<div class="od-layout"><nav class="od-tree" aria-label="Changed tests">${tree}</nav>
        <div class="od-main">
          <div class="od-scope"><small>${context}</small><h3>${name}</h3>${tabs}</div>
          ${page === "file" && purpose ? '<pre class="od-purpose"><code>test("shows landed CI wall time by build date", …)</code></pre>' : `${history()}${tables[page]()}`}
          ${page === "file" ? `<button type="button" class="od-return cursor-interaction" data-page="wall">View story CI comparison ${icon("arrow-right")}</button>` : ""}
        </div></div>`;
    }

    function render() {
      plotObserver?.disconnect();
      const onWall = state.page === "wall";
      const storyTabs = root.querySelector(".od-story .od-tabs");
      storyTabs.querySelector('[data-page="wall"]').toggleAttribute("aria-current", onWall);
      storyTabs.querySelector('[data-page="entry"]').toggleAttribute("aria-current", !onWall);
      storyTabs.querySelector("[aria-current]").setAttribute("aria-current", "page");
      reading.innerHTML = `<div class="od-content">${onWall
        ? `${endpointSummary()}${history()}${comparisonTable("By CI entry", "Entry", [["dashboard/tests", "entry", ...pages.entry.compared], ["tests", null, 43, 43, 42]])}`
        : scopeContents()}</div>`;
      const plot = reading.querySelector(".od-plot");
      if (plot) {
        plotObserver = new ResizeObserver(([{ contentRect }]) => {
          if (contentRect.width > 75) drawPlot(plot, Math.floor(contentRect.width), Math.floor(contentRect.height));
        });
        plotObserver.observe(plot);
        updatePoint(state.point);
      }
      globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
    }

    function save() {
      const snapshot = { modelContent: { view: state.page, point: dates[state.point] }, privateContent: { ...state } };
      window.openai?.setWidgetState?.(snapshot)?.catch(() => {});
    }

    function restore(saved) {
      const next = saved?.privateContent;
      if (!next || !["wall", ...Object.keys(pages)].includes(next.page)) return false;
      const restored = {
        page: next.page,
        scope: Object.hasOwn(pages, next.scope) ? next.scope : "entry",
        unit: next.unit === "fileUnit" ? "fileUnit" : "file",
        purpose: next.purpose === true,
        point: Number.isInteger(next.point) && dates[next.point] ? next.point : selected,
      };
      if (Object.keys(restored).every((key) => state[key] === restored[key])) return false;
      Object.assign(state, restored);
      return true;
    }

    root.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      const { page, point, unit, fileTab } = button.dataset;
      if (button.hasAttribute("data-refresh")) {
        updatePoint(selected, "History refreshed");
      } else if (point !== undefined) {
        updatePoint(Number(point));
      } else if (unit || fileTab || page) {
        const inStoryTabs = button.closest(".od-story") !== null;
        if (page) {
          state.page = inStoryTabs && page === "entry" ? state.scope : page;
          if (state.page !== "wall") state.scope = state.page;
          state.point = selected;
        }
        if (unit) state.unit = unit;
        if (fileTab) state.purpose = fileTab === "purpose";
        render();
        if (!inStoryTabs) {
          const focus = unit ? `[data-unit="${unit}"]` : fileTab ? `[data-file-tab="${fileTab}"]` : page === "wall" ? '.od-story [data-page="wall"]' : `.od-tree [data-page="${state.page}"]`;
          root.querySelector(focus)?.focus();
        }
      } else {
        return;
      }
      save();
    });

    root.addEventListener("change", (event) => {
      if (event.target.matches("[data-inspect]")) {
        updatePoint(Number(event.target.value));
        save();
      }
    });

    restore(window.openai?.widgetState);
    render();
    window.addEventListener("openai:set_globals", (event) => {
      if (restore(event.detail?.globals?.widgetState)) render();
    });

    if (globalThis.Tweak) {
      const tweak = new globalThis.Tweak({
        container: root,
        onChange: () => root.style.setProperty("--od-plot-height", `${design.plotHeight}px`),
      });
      tweak.addSlider(design, "plotHeight", { label: "Chart height", min: 144, max: 230, unit: "px" });
    }
  })();
</script>
