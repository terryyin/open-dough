name: CI

on:
  push:
    paths-ignore:
      - ".planning/**"
      - "docs/**"
  pull_request:
    paths-ignore:
      - ".planning/**"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

# The revision a run's CI proof names: a pull request's head, not its merge.
env:
  CI_PROOF_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

# Cancel superseded branch and pull-request runs, while keeping deliberate
# manual repetitions independent for scripts/ci-repeat.sh.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  # Distribution share selection: Distribution/tests/runner-settings.md.
  distribution-tests:
    name: Distribution Tests (${{ matrix.share }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        share: [1, 2, 3]
        include:
          - share: 1
            tests: Distribution/tests/skills/dough-execute-plan/**
          - share: 2
            tests: Distribution/evaluation/**
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      # Shared job-start epochs: slow setup shortens the test share; self-stop keeps reports.
      - name: Start prerequisite acquisition (180 seconds) and test-run (320 seconds) deadlines
        run: |
          started=$(( $(date +%s) * 1000 ))
          echo "OPEN_DOUGH_SETUP_DEADLINE_MS=$(( started + 180000 ))" >> "$GITHUB_ENV"
          echo "OPEN_DOUGH_TEST_DEADLINE_MS=$(( started + 320000 ))" >> "$GITHUB_ENV"
      # Restoring the existing npm cache and installing Node share one minute.
      - &node-deadline
        name: Start Node and npm cache deadline (60 seconds)
        run: echo "OPEN_DOUGH_NODE_DEADLINE_MS=$(( $(date +%s) * 1000 + 60000 ))" >> "$GITHUB_ENV"
      - &npm-cache
        name: Restore npm cache
        uses: actions/setup-node@v7
        id: npm-cache
        timeout-minutes: 1
        with:
          cache: npm
      - &setup-node
        name: Install pinned Node
        id: node
        timeout-minutes: 1
        run: bash scripts/setup-ci-node.sh .node-version
      - &diagnose-node-and-cache
        name: Diagnose Node acquisition failure
        if: failure() && (steps.node.outcome == 'failure' || steps.npm-cache.outcome == 'failure')
        run: &diagnose-node |
          echo '::error::Infrastructure setup: Node or npm cache acquisition failed within its 60-second deadline. Restore GitHub Releases, nodejs.org, or cache connectivity and rerun setup before checks.'
          exit 1
      - name: Install npm dependencies
        id: npm
        run: node scripts/setup-native.mjs npm
      - name: Cache Playwright Chromium
        if: ${{ !cancelled() && steps.npm.outcome == 'success' }}
        uses: actions/cache@v6
        id: playwright-cache
        timeout-minutes: 1
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1"
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Use a clean browser directory after cache failure
        if: ${{ !cancelled() && steps.playwright-cache.outcome == 'failure' }}
        run: |
          echo '::warning::Chromium cache restore failed. Installing the locked browser directly.'
          echo "PLAYWRIGHT_BROWSERS_PATH=${RUNNER_TEMP}/playwright-chromium" >> "$GITHUB_ENV"
      - name: Install Playwright Chromium
        if: ${{ !cancelled() && steps.npm.outcome == 'success' }}
        id: browser
        run: node scripts/setup-native.mjs browser
      # Cancellation signals only this step's pid; `exec` makes npm/the runner that process.
      - name: Run Distribution Tests
        id: suite
        env:
          OPEN_DOUGH_TEST_SPLIT: ${{ matrix.share }}/${{ strategy.job-total }}
          OPEN_DOUGH_TEST_TIMES: ${{ runner.temp }}/test-times.txt
          OPEN_DOUGH_TEST_OUTCOMES: ${{ runner.temp }}/test-outcomes.txt
          OPEN_DOUGH_TEST_CASE_OUTCOMES: ${{ runner.temp }}/test-case-outcomes.txt
        run: exec npm run test
      # Per-job seconds for this share, read with `gh run download`: the input
      # for moving a pattern between shares when they drift apart.
      - name: Keep per-job test times
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-times-${{ matrix.share }}
          path: ${{ runner.temp }}/test-times.txt
          if-no-files-found: ignore
          retention-days: 90
      # Each check file contributes its outcome. Node also reports test cases.
      - name: Keep the CI proof fragments
        if: ${{ !cancelled() && steps.suite.outcome != 'skipped' }}
        uses: ./.github/actions/ci-proof-fragments
        with:
          producer: distribution-tests
          part: ${{ matrix.share }}
          parts: ${{ strategy.job-total }}
          entries: Distribution
          report-format: outcomes
          unit: file
          report: ${{ runner.temp }}/test-outcomes.txt
          times: ${{ runner.temp }}/test-times.txt
          case-report: ${{ runner.temp }}/test-case-outcomes.txt

  # Lint and the dashboard type-check, each with its own step outcome, in a job
  # of their own so no browser test group's deadline pays for them.
  lint:
    name: Lint and type-check
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      # Counts from the job's start, as in the test jobs.
      - name: Start prerequisite acquisition deadline (180 seconds)
        run: echo "OPEN_DOUGH_SETUP_DEADLINE_MS=$(( $(date +%s) * 1000 + 180000 ))" >> "$GITHUB_ENV"
      - *node-deadline
      - *npm-cache
      - *setup-node
      - *diagnose-node-and-cache
      # Written out rather than aliased: the workflow checks read `run:` lines.
      - name: Install npm dependencies
        id: npm
        run: node scripts/setup-native.mjs npm
      - name: Install shell lint tools
        if: ${{ !cancelled() && steps.npm.outcome == 'success' }}
        id: lint-tools
        timeout-minutes: 1
        env:
          SHELLCHECK_VERSION: "0.11.0"
          SHFMT_VERSION: "3.14.1"
        run: bash scripts/setup-lint-tools.sh
      - name: Diagnose lint tool acquisition failure
        if: ${{ !cancelled() && steps.lint-tools.outcome == 'failure' }}
        run: |
          echo "::error::Infrastructure setup: shell lint tool acquisition failed or exceeded its setup bound. Restore GitHub Releases/Docker Hub connectivity and rerun setup before checks."
          exit 1
      - name: Run lint
        if: ${{ !cancelled() && steps.npm.outcome == 'success' && steps.lint-tools.outcome == 'success' }}
        id: lint
        run: exec npm run lint
      - name: Type-check the dashboard
        if: ${{ !cancelled() && steps.npm.outcome == 'success' }}
        id: typecheck
        run: npm run typecheck:dashboard

  # Browser producers and shard membership: dashboard/tests/shards.md.
  e2e:
    uses: ./.github/workflows/browser-test-group.yml
    with:
      group: e2e
      command: test:e2e
      settings: OPEN_DOUGH_E2E
      root: e2e
      # Capacity move from integrated, the job layout and its sizing rule:
      # dashboard/tests/shards.md#the-job-count.
      shards: "[1, 2, 3, 4, 5, 6]"
      specs: |
        1: e2e/launches/agent-* e2e/configuration/**
        2: e2e/sessions/agent-* e2e/stories/**
        3: e2e/intent/** e2e/runtime/**
        4: e2e/observation/** e2e/terminals/**
        5: e2e/review/** e2e/launches/responsive-*
  dashboard-integrated:
    uses: ./.github/workflows/browser-test-group.yml
    with:
      group: dashboard-integrated
      command: test:dashboard:integrated
      settings: OPEN_DOUGH_DASHBOARD_INTEGRATED
      root: dashboard/tests
      shards: "[1, 2]"
      # `navigation` divides by file-name prefix; shard 2 takes the rest.
      specs: |
        1: dashboard/tests/navigation/source-*
  dashboard-frontend:
    uses: ./.github/workflows/browser-test-group.yml
    with:
      group: dashboard-frontend
      command: test:dashboard:frontend
      settings: OPEN_DOUGH_DASHBOARD_FRONTEND
      root: dashboard/frontend-tests
      shards: "[1, 2]"
      specs: |
        1: dashboard/frontend-tests/intent/** dashboard/frontend-tests/navigation/** dashboard/frontend-tests/review/**
  dashboard-backend:
    uses: ./.github/workflows/browser-test-group.yml
    with:
      group: dashboard-backend
      command: test:dashboard:backend
      settings: OPEN_DOUGH_DASHBOARD_BACKEND
      root: dashboard/backend-tests
      shards: "[1, 2, 3]"
      specs: |
        1: dashboard/backend-tests/launches/** dashboard/backend-tests/runtime/** dashboard/backend-tests/review/**
        2: dashboard/backend-tests/sessions/** dashboard/backend-tests/observation/** dashboard/backend-tests/terminals/** dashboard/backend-tests/configuration/**

  # One CI proof summary per run attempt once the proof jobs settle, however they
  # ended, against declared Intent locations, parts and units their reports give.
  ci-proof:
    needs:
      - distribution-tests
      - e2e
      - dashboard-integrated
      - dashboard-frontend
      - dashboard-backend
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - *setup-node
      - name: Diagnose Node acquisition failure
        if: failure() && steps.node.outcome == 'failure'
        run: *diagnose-node
      - name: Summarize CI proof
        uses: ./.github/actions/ci-proof-summary
        with:
          expect: e2e=6:case dashboard/tests=2:case dashboard/frontend-tests=2:case dashboard/backend-tests=3:case Distribution=3:case Distribution=3:file
          frontend-entry: dashboard/frontend-tests
